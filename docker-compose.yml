services:
  tg-spam:
    build: .
    restart: always
    container_name: tg-spam-corp
    user: "1000:1000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Moscow
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_GROUP=${TELEGRAM_GROUP}
      - ADMIN_GROUP=${ADMIN_GROUP}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SERVER_ENABLED=true
      - NO_SPAM_REPLY=true
      - LOGGER_ENABLED=true
      - LOGGER_FILE=/srv/log/tg-spam.log
      - FILES_DYNAMIC=/srv/var
    volumes:
      - ./data/var:/srv/var
      - ./data/log:/srv/log
    command: --super=${SUPER_USER:-admin}
