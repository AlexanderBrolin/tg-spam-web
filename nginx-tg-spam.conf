server {
    listen 80;
    server_name spam.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name spam.example.com;

    # certbot certificates
    ssl_certificate /etc/letsencrypt/live/spam.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spam.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;

    # proxy to tg-spam container
    location / {
        proxy_pass http://BACKEND_IP:8383;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # websocket support (if needed in the future)
    location /ws {
        proxy_pass http://BACKEND_IP:8383;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
